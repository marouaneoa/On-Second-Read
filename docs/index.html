<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122d31"><title>On Second Read · Evidence desk</title><style>:root{color-scheme:light;--ink:#152c31;--quiet:#455e60;--line:#c5ceca;--accent:#9b4327;background:#f8f7f2;color:var(--ink);font:17px/1.5 "Source Sans 3",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}header,footer{background:var(--ink);color:white;padding:1rem max(5vw,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{font: bold 1.5rem Georgia,serif}.brand span{font:normal .85rem system-ui;border-left:1px solid #93a9a8;margin-left:1rem;padding-left:1rem}main{max-width:1160px;margin:auto;padding:1.6rem 1.2rem 4rem}nav{display:flex;gap:.5rem;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:1.3rem}button,select{font:inherit;color:inherit;border:1px solid #809391;border-radius:5px;background:white;padding:.55rem .85rem;cursor:pointer}button:hover,summary:hover{background:#e7ede7}button[aria-current=true],button.primary{color:white;background:#17494c}button:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #c15c32;outline-offset:3px}h1,h2,h3{line-height:1.15;font-family:Georgia,serif}h1{font-size:clamp(2.4rem,6vw,4.8rem);margin:.25rem 0 .55rem;letter-spacing:-.045em}h2{font-size:1.65rem}h3{font-size:1.15rem}small,.meta{color:var(--quiet)}.meta{font-size:.85rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.intro{padding:2rem 0 1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}.panel{padding:1.35rem;background:white;border:1px solid var(--line);border-radius:8px;margin-bottom:1rem}.panel h2:first-child{margin-top:0}.note{border-left:3px solid #a96243;background:#f6f3ed;padding:.8rem 1rem;margin:.8rem 0}.note p{margin:.3rem 0}.choice{display:flex;align-items:baseline;gap:.6rem;margin:.5rem 0;border:1px solid var(--line);border-radius:5px;padding:.65rem;cursor:pointer}.choice:has(input:checked){background:#dfebe6;border-color:#38665f}fieldset{margin:0 0 1rem;border:0;padding:0}legend{font-weight:650}input{accent-color:#175457}.feedback{background:#e3ede6;padding:1rem;border-left:4px solid #38755b}.feedback strong{display:block}.controls{display:flex;flex-wrap:wrap;gap:1rem;align-items:end}.controls label{display:grid;gap:.25rem}summary{cursor:pointer;padding:.5rem;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:1rem;background:#edf0ed;font-size:.85rem}ol{padding-left:1.5em}li{margin:.45rem 0}.trail{padding:.8rem;border-bottom:1px solid var(--line)}footer a{color:#e5ece6}button:disabled{opacity:.55;cursor:default}@media(max-width:720px){.grid{grid-template-columns:1fr}.brand span{display:none}.panel{padding:1rem}header,footer{padding:1rem}nav button{flex-grow:1}.controls select{max-width:100%}footer{flex-wrap:wrap}}

<script type="application/json" id="data">{"cases": [{"id": "missing-credit", "title": "The missing credit", "rubric": "Leadership", "reviews": ["The cover names a lead but gives no example of delegation.", "The diary shows how Sam delegated and followed up."], "passages": {"p1": {"source": "Dossier cover", "text": "Project lead: Sam Reed.", "original": true}, "p2": {"source": "Project diary", "text": "Sam coordinated two volunteers, assigned shifts and resolved a missed handoff.", "original": true}}, "criteria": {"criterion": "Leadership", "extra": "Prior management experience"}, "base": ["p2", "criterion"], "answer": 1, "variants": {"p1|criterion": [[["Reviewer A", "Leadership", "p1", "Project lead: Sam Reed.", "Dossier cover"], ["Reviewer B", "Leadership", "p1", "Project lead: Sam Reed.", "Dossier cover"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Leadership", "p1", "Project lead: Sam Reed.", "Dossier cover"], ["Reviewer B", "Prior management experience", "p1", "Project lead: Sam Reed.", "Dossier cover"]], [], [["jB", "extra"]], []], "p2|criterion": [[["Reviewer A", "Leadership", "p1", "Project lead: Sam Reed.", "Dossier cover"], ["Reviewer B", "Leadership", "p2", "Sam coordinated two volunteers, assigned shifts and resolved a missed handoff.", "Project diary"]], [["jA", "jB"]], [], []], "p2|extra": [[["Reviewer A", "Leadership", "p1", "Project lead: Sam Reed.", "Dossier cover"], ["Reviewer B", "Prior management experience", "p2", "Sam coordinated two volunteers, assigned shifts and resolved a missed handoff.", "Project diary"]], [], [["jB", "extra"]], []]}, "question": "Would the first reviewer reconsider after reading the diary?", "turtle": "@prefix os: \u003chttps://example.org/on-second-read#> .\n@prefix owl: \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/missing-credit#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"The missing credit\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Leadership\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Dossier cover\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Cover credit\" ; os:partOf :d1 ; os:quote \"Project lead: Sam Reed.\" .\n\n:d2 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Project diary\" .\n\n:p2 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Team diary\" ; os:partOf :d2 ; os:quote \"Sam coordinated two volunteers, assigned shifts and resolved a missed handoff.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"The cover names a lead but gives no example of delegation.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"The diary shows how Sam delegated and followed up.\" ; os:cites :p2 ; os:appliesCriterion :criterion .\n"}, {"id": "moving-goalpost", "title": "The moving goalpost", "rubric": "Delivery", "reviews": ["This release meets our delivery criterion.", "This release does not establish that Alex has held a management position."], "passages": {"p1": {"source": "Launch report", "text": "Alex delivered the booking service by the agreed deadline with two colleagues.", "original": true}, "practicePassage": {"source": "Hypothetical submission receipt", "text": "The candidate submitted the work on schedule.", "original": false}}, "criteria": {"criterion": "Delivery", "extra": "Prior management experience"}, "base": ["p1", "extra"], "answer": 2, "variants": {"p1|criterion": [[["Reviewer A", "Delivery", "p1", "Alex delivered the booking service by the agree \"Launch note\" ; os:partOf :d1 ; os:quote \"Alex delivered the booking service by the agreed deadline with two colleagues.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"This release meets our delivery criterion.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"This release does not establish that Alex has held a management position.\" ; os:cites :p1 ; os:appliesCriterion :extra .\n"}, {"id": "same-reasoning", "title": "Different words, same reasoning", "rubric": "Verification", "reviews": ["The recorded replay verifies the fix.", "Noor checked that the incident could no longer be reproduced."], "passages": {"p1": {"source": "Release notebook", "text": "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "original": true}, "practicePassage": {"source": "Hypothetical submission receipt", "text": "The candidate submitted the work on schedule.", "original": false}}, "criteria": {"criterion": "Verification", "extra": "Prior management experience"}, "base": ["p1", "criterion"], "answer": 3, "variants": {"p1|criterion": [[["Reviewer A", "Verification", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"], ["Reviewer B", "Verification", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Verification", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"], ["Reviewer B", "Prior management experience", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"]], [], [["jB", "extra"]], []], "practicePassage|criterion": [[["Reviewer A", "Verification", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"], ["Reviewer B", "Verification", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [["jA", "jB"]], [], []], "practicePassage|extra": [[["Reviewer A", "Verification", "p1", "Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.", "Release notebook"], ["Reviewer B", "Prior management experience", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [], [["jB", "extra"]], []]}, "question": "What further information would you need to compare the reviewers\u2019 overall recommendations?", "turtle": "@prefix os: \u003chttps://example.org/on-second-read#> .\n@prefix owl: \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/same-reasoning#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"Different words, same reasoning\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Verification\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Release notebook\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Test log\" ; os:partOf :d1 ; os:quote \"Before shipping, Noor replayed the incident against the patch and recorded a passing regression test.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"The recorded replay verifies the fix.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"Noor checked that the incident could no longer be reproduced.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n"}], "queries": ["PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT ?reviewer ?criterion ?passage ?quote ?source WHERE {\n  ?case os:hasReview ?review .\n  ?review rdfs:label ?reviewer ; os:containsJudgment ?j .\n  ?j os:appliesCriterion/rdfs:label ?criterion ; os:cites ?passage .\n  ?passage os:quote ?quote ; os:partOf/rdfs:label ?source .\n} ORDER BY ?reviewer ?passage\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?a ?b WHERE {\n  ?case os:hasReview ?ra, ?rb .\n  ?ra os:containsJudgment ?a .\n  ?rb os:containsJudgment ?b .\n  ?a os:appliesCriterion ?criterion ; os:cites ?pa ; os:wording ?wa .\n  ?b os:appliesCriterion ?criterion ; os:cites ?pb ; os:wording ?wb .\n  FILTER (STR(?ra) \u003c STR(?rb) && ?pa != ?pb)\n} ORDER BY ?a ?b\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT ?judgment ?criterion WHERE {\n  ?case os:hasReview/os:containsJudgment ?judgment .\n  ?judgment os:appliesCriterion ?criterion .\n  FILTER NOT EXISTS { ?case os:listsCriterion ?criterion }\n} ORDER BY ?judgment\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?a ?b WHERE {\n  ?case os:hasReview ?ra, ?rb .\n  ?ra os:containsJudgment ?a .\n  ?rb os:containsJudgment ?b .\n  ?a os:appliesCriterion ?criterion ; os:cites ?pa ; os:wording ?wa .\n  ?b os:appliesCriterion ?criterion ; os:cites ?pb ; os:wording ?wb .\n  FILTER (STR(?ra) \u003c STR(?rb) && ?pa = ?pb && ?wa != ?wb)\n} ORDER BY ?a ?b\n"]}</script><script>const {cases, queries} = JSON.parse(document.querySelector('#data').textContent);
const desk = document.querySelector('#desk');
const nav = document.querySelector('#cases');
const labels = ['Source trace', 'Same criterion, different evidence', 'A criterion outside the rubric', 'Same criterion and citation, different wording'];
const briefs = {
  'missing-credit': ['What changes between these two leadership assessments?', 'Which detail would you put before the panel?', ['The project title identifies who delegated tasks.', 'The diary describes assigning shifts and resolving a missed handoff.', 'The diary proves both reviewers reached the same verdict.'], 1, 'The cover identifies a lead. Only the diary describes the coordination work.'],
  'moving-goalpost': ['Which requirement did the panel actually publish?', 'What would you ask the panel to justify?', ['Why the launch report mentions a deadline.', 'Whether the candidate worked alone.', 'Why management experience enters a delivery assessment.'], 2, 'The release addresses delivery. The second judgment introduces management experience, which is absent from the complete rubric.'],
  'same-reasoning': ['Does different wording change the evidence trail?', 'Which conclusion can you defend from the file?', ['Both cite the recorded replay under the verification criterion.', 'Both would make the same hiring decision.', 'The wording shows that they used different tests.'], 0, 'The trace converges on the same passage and criterion. The file records no overall hiring recommendation.']
};
const key = 'on-second-read.answers.v1';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch {}
let current;
const esc = s => String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid = c => Array.isArray(saved[c.id]) && [1,2,3].includes(saved[c.id][0]) && [0,1,2].includes(saved[c.id][1]);
function store(){try {localStorage.setItem(key, JSON.stringify(saved));} catch {}}
function choices(name, items, offset){
  return items.map((text,i)=>`<label class="choice"><input required type="radio" name="${name}" value="${i+offset}">${esc(text)}</label>`).join('');
}
function openCase(){
  current = cases.find(c => c.id === location.hash.slice(1)) || cases[0];
  const c=current, brief=briefs[c.id], done=valid(c);
  document.querySelector('#progress').textContent = cases.filter(valid).length+' / '+cases.length+' cases reviewed';
  nav.innerHTML = cases.map(item=>`<button aria-current="${item.id===c.id}" data-case="${item.id}">${valid(item)?'✓ ':''}${esc(item.title)}</button>`).join('');
  const baseline=c.variants[c.base.join('|')][0];
  desk.innerHTML=`<section class="intro"><div class="meta">Case file · ${esc(c.rubric)}</div><h1>${esc(c.title)}</h1><p>${esc(brief[0])}</p></section>
  <div class="grid"><section class="panel"><h2>Candidate dossier</h2><p><b>Published rubric</b> · ${esc(c.rubric)}</p>
  ${Object.entries(c.passages).filter(([,p])=>p.original).map(([id,p])=>`<div class="note"><small>${esc(id)} / ${esc(p.source)}</small><p>${esc(p.text)}</p></div>`).join('')}</section>
  <section class="panel"><h2>Panel notes</h2>${c.reviews.map((w,i)=>`<div class="note"><small>${esc(baseline[i][0])} · cites ${esc(baseline[i][2])}</small><p>“${esc(w)}”</p></div>`).join('')}</section></div>
  <section class="panel" id="decision"><h2>Your assessment</h2>${done?feedback(c):`<form><fieldset><legend>Which pattern connects the reviews?</legend>${choices('pattern',labels.slice(1),1)}</fieldset><fieldset><legend>${esc(brief[1])}</legend>${choices('reason',brief[2],0)}</fieldset><button class="primary">Check my reasoning</button></form>`}</section>${done?'<section class="panel" id="lab"></section>':''}`;
  const form=desk.querySelector('form');
  if(form) form.onsubmit=e=>{e.preventDefault(); const values=new FormData(form);saved[c.id]=['pattern','reason'].map(k=>Number(values.get(k)));store();openCase();desk.querySelector('#decision').scrollIntoView();};
  if(done){
    desk.querySelector('#retry').onclick=()=>{delete saved[c.id];store();openCase();};
    showLab(c);
  }
}
function feedback(c){
  const [p,r]=saved[c.id], brief=briefs[c.id];
  const score=Number(p===c.answer)+Number(r===brief[3]);
  return `<div class="feedback"><strong>${score} of 2 supported by the record</strong>
  <p>Your pattern: ${esc(labels[p])}.<br>Your evidence: ${esc(brief[2][r])}</p>
  <p><b>Finding</b> · ${esc(labels[c.answer])}. ${esc(brief[4])}</p></div>
  <p><b>For discussion</b> · ${esc(c.question)}</p><button id="retry">Try this case again</button>`;
}
function showLab(c){
  const lab=desk.querySelector('#lab');
  const options=(entries,base)=>entries.map(([v,label])=>`<option value="${esc(v)}" ${v===base?'selected':''}>${esc(label)}</option>`).join('');
  lab.innerHTML=`<h2>Evidence lab</h2><p>Change Reviewer B’s recorded citation or criterion. Compare the resulting graph with the original panel notes above.</p>
  <div class="controls"><label>Cited passage<select id="citation">${options(Object.entries(c.passages).map(([id,p])=>[id,p.source]),c.base[0])}</select></label>
  <label>Applied criterion<select id="criterion">${options(Object.entries(c.criteria),c.base[1])}</select></label><button id="restore">Restore original</button></div>
  <div id="outcome" aria-live="polite"></div>
  <details><summary>Inspect a SPARQL query and its rows</summary><select aria-label="Query" id="query">${options(labels.map((s,i)=>[i,s]),0)}</select><pre id="sparql"></pre><pre id="rows"></pre></details>
  <details><summary>Read the original Turtle file</summary><pre>${esc(c.turtle)}</pre></details>`;
  const citation=lab.querySelector('#citation'), criterion=lab.querySelector('#criterion'), query=lab.querySelector('#query');
  function update(){
    const result=c.variants[[citation.value,criterion.value].join('|')], original=c.variants[c.base.join('|')];
    const modified=citation.value!==c.base[0] || criterion.value!==c.base[1];
    const active=labels.slice(1).flatMap((name,i)=>result[i+1].length?[name]:[]);
    const changes=labels.slice(1).flatMap((name,i)=>Boolean(original[i+1].length)===Boolean(result[i+1].length)?[]:[(result[i+1].length?'Added':'Removed')+' · '+name]);
    lab.querySelector('#outcome').innerHTML=`<h3>${modified?'Hypothetical evidence trail':'Original evidence trail'}</h3>
    ${result[0].map(([who,crit,id,quote,src])=>`<div class="trail"><b>${esc(who)}</b> → ${esc(crit)} → ${esc(src)} <small>(${esc(id)})</small><br>“${esc(quote)}”</div>`).join('')}
    <p><b>Matching patterns</b> · ${esc(active.join(' / ')||'None')}</p>${modified?`<p>${esc(changes.join(' / ')||'The matching patterns are unchanged.')}</p>`:''}`;
    lab.querySelector('#sparql').textContent=queries[query.value];
    lab.querySelector('#rows').textContent=result[query.value].map(row=>row.join(' | ')).join('\n')||'0 matching rows';
    lab.querySelector('#restore').disabled=!modified;
  }
  for(const control of [citation,criterion,query]) control.onchange=update;
  lab.querySelector('#restore').onclick=()=>{[citation.value,criterion.value]=c.base;update();};
  update();
}
nav.onclick=e=>{if(e.target.dataset.case)location.hash=e.target.dataset.case;};
window.addEventListener('hashchange',openCase);
openCase();
</script></html>
