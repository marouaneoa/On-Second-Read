<script type="application/json" id="data">{"cases": [{"guide": {"context": "Sam Reed is applying to coordinate volunteers at a neighbourhood food pantry. At the end of the interview the panel receives two pages about a Saturday delivery Sam organised. The first is a cover sheet for the funder. The second is an entry the volunteers wrote after the shift. Both reviewers have both pages. Each has been asked to cite the one page that best explains their assessment.", "rule": "Leadership means giving people clear responsibilities and adjusting the plan when something goes wrong. You are deciding whether the panel has evidence of those actions.", "walk": "Start with the cover. A contact name tells Reviewer A whom to call. It leaves the division of work unanswered. Now read the diary verbs: gave, asked, reassigned. Reviewer B can point to the very actions A wanted to see. Both used the same leadership standard. A change of source explains the different strength of their judgments."}, "id": "missing-credit", "title": "The missing credit", "rubric": "Leadership", "reviews": ["The cover gives me someone to contact and tells me the delivery finished. I can see that Sam was named lead. I would leave the delegation box open because this page never tells me what Sam asked another person to do.", "I can fill in the delegation box from the diary. Sam assigned two different jobs, noticed that people were duplicating work and changed one assignment. Those are observable decisions about the team."], "passages": {"p1": {"source": "Dossier cover", "text": "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "original": true}, "p2": {"source": "Project diary", "text": "At eight, Sam gave Jo the route list and asked Eli to check the boxes against it. When a driver missed the handoff, both volunteers started calling the same households. Sam stopped the duplicate calls, reassigned Eli to the loading bay and stayed with Jo until each household had a new delivery time.", "original": true}}, "criteria": {"criterion": "Leadership", "extra": "Prior management experience"}, "base": ["p2", "criterion"], "answer": 1, "variants": {"p1|criterion": [[["Reviewer A", "Leadership", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"], ["Reviewer B", "Leadership", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Leadership", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"], ["Reviewer B", "Prior management experience", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"]], [], [["jB", "extra"]], []], "p2|criterion": [[["Reviewer A", "Leadership", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"], ["Reviewer B", "Leadership", "p2", "At eight, Sam gave Jo the route list and asked Eli to check the boxes against it. When a driver missed the handoff, both volunteers started calling the same households. Sam stopped the duplicate calls, reassigned Eli to the loading bay and stayed with Jo until each household had a new delivery time.", "Project diary"]], [["jA", "jB"]], [], []], "p2|extra": [[["Reviewer A", "Leadership", "p1", "Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.", "Dossier cover"], ["Reviewer B", "Prior management experience", "p2", "At eight, Sam gave Jo the route list and asked Eli to check the boxes against it. When a driver missed the handoff, both volunteers started calling the same households. Sam stopped the duplicate calls, reassigned Eli to the loading bay and stayed with Jo until each household had a new delivery time.", "Project diary"]], [], [["jB", "extra"]], []]}, "question": "What would you show Reviewer A before the panel finalises the leadership assessment?", "turtle": "@prefix os: \u003chttps://example.org/on-second-read#> .\n@prefix owl: \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/missing-credit#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"The missing credit\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Leadership\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Dossier cover\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Dossier cover excerpt\" ; os:partOf :d1 ; os:quote \"Saturday delivery team. Project lead: Sam Reed. The funder asked for one contact for questions about expenses, so this cover sheet names one person. The team delivered eighteen boxes before noon. The space beneath the contact name lists the total cost and the number of households served.\" .\n\n:d2 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Project diary\" .\n\n:p2 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Project diary excerpt\" ; os:partOf :d2 ; os:quote \"At eight, Sam gave Jo the route list and asked Eli to check the boxes against it. When a driver missed the handoff, both volunteers started calling the same households. Sam stopped the duplicate calls, reassigned Eli to the loading bay and stayed with Jo until each household had a new delivery time.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"The cover gives me someone to contact and tells me the delivery finished. I can see that Sam was named lead. I would leave the delegation box open because this page never tells me what Sam asked another person to do.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"I can fill in the delegation box from the diary. Sam assigned two different jobs, noticed that people were duplicating work and changed one assignment. Those are observable decisions about the team.\" ; os:cites :p2 ; os:appliesCriterion :criterion .\n"}, {"guide": {"context": "Alex is interviewing to run small software releases for a community clinic. Before seeing any applications, the panel wrote down what would count as success in this exercise. The chair now asks two reviewers to evaluate a booking-system launch. Alex has supplied the same signed launch report to both of them.", "rule": "Delivery means getting the agreed service into use by the promised date. For this exercise that is the complete published requirement.", "walk": "Follow both citations and you land on the same launch report. The difference appears when you ask what would satisfy each reviewer. A wants evidence of a working service by Friday and finds it. B wants a previous management position. Even a perfectly delivered release could fail that second test. The published rubric gives the panel grounds to ask B to justify introducing it."}, "id": "moving-goalpost", "title": "The moving goalpost", "rubric": "Delivery", "reviews": ["I checked the promise at the top of the report against the sign-off at the bottom. Staff could perform both tasks on Friday. That gives me a concrete reason to credit Alex for delivery.", "The report shows three contributors but never says anyone reported to Alex. Before I award a positive assessment, I want evidence that Alex previously held a management position with direct reports."], "passages": {"p1": {"source": "Launch report", "text": "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "original": true}, "practicePassage": {"source": "Hypothetical submission receipt", "text": "The candidate submitted the work on schedule.", "original": false}}, "criteria": {"criterion": "Delivery", "extra": "Prior management experience"}, "base": ["p1", "extra"], "answer": 2, "variants": {"p1|criterion": [[["Reviewer A", "Delivery", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"], ["Reviewer B", "Delivery", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Delivery", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"], ["Reviewer B", "Prior management experience", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"]], [], [["jB", "extra"]], []], "practicePassage|criterion": [[["Reviewer A", "Delivery", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"], ["Reviewer B", "Delivery", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [["jA", "jB"]], [], []], "practicePassage|extra": [[["Reviewer A", "Delivery", "p1", "The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.", "Launch report"], ["Reviewer B", "Prior management experience", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [], [["jB", "extra"]], []]}, "question": "What should the chair ask before using Reviewer B\u2019s requirement to compare applicants?", "turtle": "@prefix os: \u003chttps://example.org/on-second-read#> .\n@prefix owl: \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/moving-goalpost#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"The moving goalpost\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Delivery\" .\n\n:extra a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Prior management experience\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Launch report\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Launch report excerpt\" ; os:partOf :d1 ; os:quote \"The clinic and Alex agreed that reception staff would be able to book and cancel visits by Friday afternoon. Alex split the work with two colleagues. On Thursday reception tried both tasks with sample appointments. On Friday at noon the clinic manager signed off and staff began using the service. The report lists everyone as a project contributor.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"I checked the promise at the top of the report against the sign-off at the bottom. Staff could perform both tasks on Friday. That gives me a concrete reason to credit Alex for delivery.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"The report shows three contributors but never says anyone reported to Alex. Before I award a positive assessment, I want evidence that Alex previously held a management position with direct reports.\" ; os:cites :p1 ; os:appliesCriterion :extra .\n"}, {"guide": {"context": "Noor maintains software for a library. Returning the same book twice used to remove a second, unrelated loan from the reader\u2019s account. Noor submitted a fix. Two reviewers on a hiring panel read the release notebook to decide whether Noor checked the change carefully enough. One reviewer writes like a developer and the other writes for library staff.", "rule": "Verification means recreating the original failure and recording what happens after the repair. In this case a replay means repeating the same sequence of actions with a test account.", "walk": "Translate \u201cregression test\u201d into the library scene: try the mistaken return again and check the other book. That is exactly the check the second reviewer describes. Both judgments point to the same notebook entry and the same verification requirement. You can establish that overlap even though the reviewers use different words. Their overall hiring recommendations remain unknown."}, "id": "same-reasoning", "title": "Different words, same reasoning", "rubric": "Verification", "reviews": ["The recorded replay verifies the fix. Noor first reproduced the loss of the second loan and then showed that the regression test passed on the repaired version. I can follow the sequence in the notebook.", "I wanted to know whether the other book would still be there after a mistaken second return. Noor tried that very mistake before and after the repair and wrote down both results. That answers my verification question."], "passages": {"p1": {"source": "Release notebook", "text": "I made a test account with two books on loan. On the old version I returned the first book twice. Both loans disappeared. I repeated those exact steps with the fix installed. The second book stayed on the account. I saved the steps as a regression test, a check we can run again after future changes.", "original": true}, "practicePassage": {"source": "Hypothetical submission receipt", "text": "The candidate submitted the work on schedule.", "original": false}}, "criteria": {"criterion": "Verification", "extra": "Prior management experience"}, "base": ["p1", "criterion"], "answer": 3, "variants": {"p1|criterion": [[["Reviewer A", "Verification", "p1", "I made a test account with two books on loan. On the old version I returned the first book twice. Both loans disappeared. I repeated those exact steps with the fix installed. The second book stayed on the account. I saved the steps as a regression test, a check we can run again after future changes.", "Release notebook"], ["Reviewer B", "Verification", "p1", "I made a test account with two books on loan. On the old version I returned the first book twice. Both loans disappeared. I repeated those exact steps with the fix installed. The second book stayed on the account. I saved the steps as a regression test, a check we can run again after future changes.", "Release notebook"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Verification", "p1", "I made a test account with two books on  \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/same-reasoning#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"Different words, same reasoning\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Verification\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Release notebook\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Release notebook excerpt\" ; os:partOf :d1 ; os:quote \"I made a test account with two books on loan. On the old version I returned the first book twice. Both loans disappeared. I repeated those exact steps with the fix installed. The second book stayed on the account. I saved the steps as a regression test, a check we can run again after future changes.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"The recorded replay verifies the fix. Noor first reproduced the loss of the second loan and then showed that the regression test passed on the repaired version. I can follow the sequence in the notebook.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"I wanted to know whether the other book would still be there after a mistaken second return. Noor tried that very mistake before and after the repair and wrote down both results. That answers my verification question.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n"}, {"guide": {"context": "Leila is applying to supervise evening maintenance at a theatre. An evening supervisor sometimes leaves before the morning crew arrives, so a repair may cross two shifts. The panel asks how Leila handled a faulty light above the stage. The file includes a message written at midnight and a record completed by the incoming technician.", "rule": "A safe handover requires the next worker to know which equipment is unsafe and who will take responsibility. Look for what the outgoing worker communicated and what the incoming worker understood.", "walk": "Put the two records in time order. At midnight the blank line genuinely leaves a question. At six the named technician answers it. The reviewers are using the same safety requirement at different points along the paper trail. An unanswered question in the earlier record is compatible with a completed handover in the later one.", "brief": ["Did someone actually accept the handover?", "Which detail resolves the first reviewer\u2019s question?", ["The red tag had a colour.", "The next technician repeated the instruction and signed for the test.", "The theatre had a spare lamp."], 1, "The receipt records acceptance."]}, "id": "the-night-shift", "title": "The night shift", "rubric": "Safe handover", "reviews": ["From the outgoing message I know Leila identified the hazard. The empty name line leaves me wondering whether anybody actually took over. I would ask for a receipt before giving full credit for the handover.", "The morning receipt closes that gap for me. The technician repeated the instruction to Leila and signed for the cable test. I can identify the person who accepted responsibility and the equipment they discussed."], "passages": {"p1": {"source": "Outgoing shift message", "text": "I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived.", "original": true}, "p2": {"source": "Morning receipt", "text": "At six I read Leila\u2019s message on the shift phone. I called her and repeated the lamp number and the instruction to leave its power off. She confirmed both details. I entered my name as the person responsible for testing the cable and told the stage manager to use lamp five instead.", "original": true}}, "criteria": {"criterion": "Safe handover", "extra": "Prior management experience"}, "base": ["p2", "criterion"], "answer": 1, "variants": {"p1|criterion": [[["Reviewer A", "Safe handover", "p1", "I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived.", "Outgoing shift message"], ["Reviewer B", "Safe handover", "p1", "I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived.", "Outgoing shift message"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Safe handover", "p1", "I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived.", "Outgoing shift message"], ["Reviewer B", "Prior management experience", "p1", "I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived."    rdfs:label \"The night shift\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Safe handover\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Outgoing shift message\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Outgoing shift message excerpt\" ; os:partOf :d1 ; os:quote \"I placed a red tag on lamp four and switched its circuit off. My message to the morning crew said to leave that lamp isolated until someone tested the cable. I sent the message to the shared shift phone at midnight. I left the line for the receiving technician\u2019s name blank because nobody had arrived.\" .\n\n:d2 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Morning receipt\" .\n\n:p2 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Morning receipt excerpt\" ; os:partOf :d2 ; os:quote \"At six I read Leila\u2019s message on the shift phone. I called her and repeated the lamp number and the instruction to leave its power off. She confirmed both details. I entered my name as the person responsible for testing the cable and told the stage manager to use lamp five instead.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"From the outgoing message I know Leila identified the hazard. The empty name line leaves me wondering whether anybody actually took over. I would ask for a receipt before giving full credit for the handover.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"The morning receipt closes that gap for me. The technician repeated the instruction to Leila and signed for the cable test. I can identify the person who accepted responsibility and the equipment they discussed.\" ; os:cites :p2 ; os:appliesCriterion :criterion .\n"}, {"guide": {"context": "Ravi applies for a museum visitor-services job. The practical exercise asks candidates to write directions for a visitor who has never used the ticket machine. The panel receives a short observation from the trial. One reviewer asks whether a visitor could complete the task. The other is interested in how Ravi learned to write.", "rule": "Clear instructions means a first-time visitor can collect a ticket without help. The exercise has one published criterion. The application materials do not request a particular degree.", "walk": "Both reviewers read the same trial. A asks whether the visitor succeeded unaided, exactly the test the panel published. B moves from the visitor\u2019s performance to Ravi\u2019s formal qualification. Publishing a degree requirement would change the exercise. The file gives no basis for assuming that Ravi has, or lacks, that degree.", "brief": ["What is the visitor trial meant to establish?", "Which question introduces a new standard?", ["Could the visitor collect the ticket?", "Did the observer supply a hint?", "Does Ravi hold a technical-writing degree?"], 2, "A degree is an additional requirement."]}, "id": "whose-words", "title": "Whose words count?", "rubric": "Clear instructions", "reviews": ["I watched for the moment the visitor might need a hint. The observer records that there were no prompts. The visitor got the ticket, so I have direct evidence that these instructions were clear enough for this task.", "The trial tells me that this visitor succeeded. Before I give credit, I would also want a degree in technical writing. A single successful visit cannot tell me where Ravi learned to produce instructions."], "passages": {"p1": {"source": "Visitor trial", "text": "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "original": true}, "practicePassage": {"source": "Hypothetical submission receipt", "text": "The candidate submitted the work on schedule.", "original": false}}, "criteria": {"criterion": "Clear instructions", "extra": "Technical-writing degree"}, "base": ["p1", "extra"], "answer": 2, "variants": {"p1|criterion": [[["Reviewer A", "Clear instructions", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"], ["Reviewer B", "Clear instructions", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"]], [], [], [["jA", "jB"]]], "p1|extra": [[["Reviewer A", "Clear instructions", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"], ["Reviewer B", "Technical-writing degree", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"]], [], [["jB", "extra"]], []], "practicePassage|criterion": [[["Reviewer A", "Clear instructions", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"], ["Reviewer B", "Clear instructions", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [["jA", "jB"]], [], []], "practicePassage|extra": [[["Reviewer A", "Clear instructions", "p1", "A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.", "Visitor trial"], ["Reviewer B", "Technical-writing degree", "practicePassage", "The candidate submitted the work on schedule.", "Hypothetical submission receipt"]], [], [["jB", "extra"]], []]}, "question": "How could the panel test clarity with more visitors while still using the published criterion?", "turtle": "@prefix os: \u003chttps://example.org/on-second-read#> .\n@prefix owl: \u003chttp://www.w3.org/2002/07/owl#> .\n@prefix rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#> .\n@prefix : \u003chttps://example.org/on-second-read/whose-words#> .\n\n:case a owl:NamedIndividual, os:Case ;\n    rdfs:label \"Whose words count?\" ; os:listsCriterion :criterion ; os:hasReview :reviewA, :reviewB .\n\n:criterion a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Clear instructions\" .\n\n:extra a owl:NamedIndividual, os:Criterion ;\n    rdfs:label \"Technical-writing degree\" .\n\n:d1 a owl:NamedIndividual, os:Document ;\n    rdfs:label \"Visitor trial\" .\n\n:p1 a owl:NamedIndividual, os:Passage ;\n    rdfs:label \"Visitor trial excerpt\" ; os:partOf :d1 ; os:quote \"A visitor who had never used this machine read Ravi\u2019s card. It said to select a language, tap Collect booking and enter the six digits on the confirmation slip. The visitor followed the three steps, collected the ticket and joined the entrance queue. The observer stayed behind the marked line and gave no prompts.\" .\n\n:reviewA a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer A\" ; os:containsJudgment :jA .\n\n:jA a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment A\" ; os:wording \"I watched for the moment the visitor might need a hint. The observer records that there were no prompts. The visitor got the ticket, so I have direct evidence that these instructions were clear enough for this task.\" ; os:cites :p1 ; os:appliesCriterion :criterion .\n\n:reviewB a owl:NamedIndividual, os:Review ;\n    rdfs:label \"Reviewer B\" ; os:containsJudgment :jB .\n\n:jB a owl:NamedIndividual, os:Judgment ;\n    rdfs:label \"Judgment B\" ; os:wording \"The trial tells me that this visitor succeeded. Before I give credit, I would also want a degree in technical writing. A single successful visit cannot tell me where Ravi learned to produce instructions.\" ; os:cites :p1 ; os:appliesCriterion :extra .\n"}], "queries": ["PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT ?reviewer ?criterion ?passage ?quote ?source WHERE {\n  ?case os:hasReview ?review .\n  ?review rdfs:label ?reviewer ; os:containsJudgment ?j .\n  ?j os:appliesCriterion/rdfs:label ?criterion ; os:cites ?passage .\n  ?passage os:quote ?quote ; os:partOf/rdfs:label ?source .\n} ORDER BY ?reviewer ?passage\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?a ?b WHERE {\n  ?case os:hasReview ?ra, ?rb .\n  ?ra os:containsJudgment ?a .\n  ?rb os:containsJudgment ?b .\n  ?a os:appliesCriterion ?criterion ; os:cites ?pa ; os:wording ?wa .\n  ?b os:appliesCriterion ?criterion ; os:cites ?pb ; os:wording ?wb .\n  FILTER (STR(?ra) \u003c STR(?rb) && ?pa != ?pb)\n} ORDER BY ?a ?b\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT ?judgment ?criterion WHERE {\n  ?case os:hasReview/os:containsJudgment ?judgment .\n  ?judgment os:appliesCriterion ?criterion .\n  FILTER NOT EXISTS { ?case os:listsCriterion ?criterion }\n} ORDER BY ?judgment\n", "PREFIX os: \u003chttps://example.org/on-second-read#>\nPREFIX rdfs: \u003chttp://www.w3.org/2000/01/rdf-schema#>\nSELECT DISTINCT ?a ?b WHERE {\n  ?case os:hasReview ?ra, ?rb .\n  ?ra os:containsJudgment ?a .\n  ?rb os:containsJudgment ?b .\n  ?a os:appliesCriterion ?criterion ; os:cites ?pa ; os:wording ?wa .\n  ?b os:appliesCriterion ?criterion ; os:cites ?pb ; os:wording ?wb .\n  FILTER (STR(?ra) \u003c STR(?rb) && ?pa = ?pb && ?wa != ?wb)\n} ORDER BY ?a ?b\n"]}</script><script>const {cases, queries} = JSON.parse(document.querySelector('#data').textContent);
const desk = document.querySelector('#desk');
const nav = document.querySelector('#cases');
const labels = ['Source trace', 'Same criterion, different evidence', 'A criterion outside the rubric', 'Same criterion and citation, different wording'];
const briefs = {
  'missing-credit': ['What changes between these two leadership assessments?', 'Which detail would you put before the panel?', ['The project title identifies who delegated tasks.', 'The diary describes assigning jobs and resolving a missed handoff.', 'The diary proves both reviewers reached the same verdict.'], 1, 'The cover identifies a lead. Only the diary describes the coordination work.'],
  'moving-goalpost': ['Which requirement did the panel actually publish?', 'What would you ask the panel to justify?', ['Why the launch report mentions a deadline.', 'Whether the candidate worked alone.', 'Why management experience enters a delivery assessment.'], 2, 'The release addresses delivery. The second judgment introduces management experience, which is absent from the complete rubric.'],
  'same-reasoning': ['Does different wording change the evidence trail?', 'Which conclusion can you defend from the file?', ['Both cite the recorded replay under the verification criterion.', 'Both would make the same hiring decision.', 'The wording shows that they used different tests.'], 0, 'The trace converges on the same passage and criterion. The file records no overall hiring recommendation.']
};
const key = 'on-second-read.answers.v2';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch {}
let current;
const esc = s => String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const valid = c => Array.isArray(saved[c.id]) && [1,2,3].includes(saved[c.id][0]) && [0,1,2].includes(saved[c.id][1]);
function store(){try {localStorage.setItem(key, JSON.stringify(saved));} catch {}}
function choices(name, items, offset){
  return items.map((text,i)=>`<label class="choice"><input required type="radio" name="${name}" value="${i+offset}">${esc(text)}</label>`).join('');
}
function openCase(){
  current = cases.find(c => c.id === location.hash.slice(1)) || cases[0];
  const c=current, brief=c.guide.brief || briefs[c.id], done=valid(c);
  document.querySelector('#progress').textContent = cases.filter(valid).length+' / '+cases.length+' cases reviewed';
  nav.innerHTML = cases.map(item=>`<button aria-current="${item.id===c.id}" data-case="${item.id}">${valid(item)?'✓ ':''}${esc(item.title)}</button>`).join('');
  const baseline=c.variants[c.base.join('|')][0];
  desk.innerHTML=`<section class="intro"><div class="meta">Case file · ${esc(c.rubric)}</div><h1>${esc(c.title)}</h1><p>${esc(c.guide.context)}</p><p><strong>${esc(brief[0])}</strong></p></section>
  <div class="grid"><section class="panel"><h2>Candidate dossier</h2><p><b>Published rubric</b> · ${esc(c.rubric)}</p><p>${esc(c.guide.rule)}</p>
  ${Object.entries(c.passages).filter(([,p])=>p.original).map(([id,p])=>`<div class="note"><small>${esc(id)} / ${esc(p.source)}</small><p>${esc(p.text)}</p></div>`).join('')}</section>
  <section class="panel"><h2>Panel notes</h2>${c.reviews.map((w,i)=>`<div class="note"><small>${esc(baseline[i][0])} · cites ${esc(baseline[i][2])}</small><p>“${esc(w)}”</p></div>`).join('')}</section></div>
  <section class="panel" id="decision"><h2>Your assessment</h2><p>First ask what each reviewer wanted to see. Then check which passage each one used. A criterion is the standard they applied. A citation points to the passage they relied on.</p>${done?feedback(c):`<form><fieldset><legend>Which pattern connects the reviews?</legend>${choices('pattern',labels.slice(1),1)}</fieldset><fieldset><legend>${esc(brief[1])}</legend>${choices('reason',brief[2],0)}</fieldset><button class="primary">Check my reasoning</button></form>`}</section>${done?'<section class="panel" id="lab"></section>':''}`;
  const form=desk.querySelector('form');
  if(form) form.onsubmit=e=>{e.preventDefault(); const values=new FormData(form);saved[c.id]=['pattern','reason'].map(k=>Number(values.get(k)));store();openCase();desk.querySelector('#decision').scrollIntoView();};
  if(done){
    desk.querySelector('#retry').onclick=()=>{delete saved[c.id];store();openCase();};
    showLab(c);
  }
}
function feedback(c){
  const [p,r]=saved[c.id], brief=c.guide.brief || briefs[c.id];
  const score=Number(p===c.answer)+Number(r===brief[3]);
  return `<div class="feedback"><strong>${score} of 2 supported by the record</strong>
  <p>Your pattern: ${esc(labels[p])}.<br>Your evidence: ${esc(brief[2][r])}</p>
  <p><b>Finding</b> · ${esc(labels[c.answer])}. ${esc(c.guide.walk)}</p></div>
  <p><b>For discussion</b> · ${esc(c.question)}</p><button id="retry">Try this case again</button>`;
}
function showLab(c){
  const lab=desk.querySelector('#lab');
  const options=(entries,base)=>entries.map(([v,label])=>`<option value="${esc(v)}" ${v===base?'selected':''}>${esc(label)}</option>`).join('');
  lab.innerHTML=`<h2>Evidence lab</h2><p>Change Reviewer B’s recorded citation or criterion. Compare the resulting graph with the original panel notes above.</p>
  <div class="controls"><label>Cited passage<select id="citation">${options(Object.entries(c.passages).map(([id,p])=>[id,p.source]),c.base[0])}</select></label>
  <label>Applied criterion<select id="criterion">${options(Object.entries(c.criteria),c.base[1])}</select></label><button id="restore">Restore original</button></div>
  <div id="outcome" aria-live="polite"></div>
  <details><summary>Inspect a SPARQL query and its rows</summary><select aria-label="Query" id="query">${options(labels.map((s,i)=>[i,s]),0)}</select><pre id="sparql"></pre><pre id="rows"></pre></details>
  <details><summary>Read the original Turtle file</summary><pre>${esc(c.turtle)}</pre></details>`;
  const citation=lab.querySelector('#citation'), criterion=lab.querySelector('#criterion'), query=lab.querySelector('#query');
  function update(){
    const result=c.variants[[citation.value,criterion.value].join('|')], original=c.variants[c.base.join('|')];
    const modified=citation.value!==c.base[0] || criterion.value!==c.base[1];
    const active=labels.slice(1).flatMap((name,i)=>result[i+1].length?[name]:[]);
    const changes=labels.slice(1).flatMap((name,i)=>Boolean(original[i+1].length)===Boolean(result[i+1].length)?[]:[(result[i+1].length?'Added':'Removed')+' · '+name]);
    lab.querySelector('#outcome').innerHTML=`<h3>${modified?'Hypothetical evidence trail':'Original evidence trail'}</h3>
    ${result[0].map(([who,crit,id,quote,src])=>`<div class="trail"><b>${esc(who)}</b> → ${esc(crit)} → ${esc(src)} <small>(${esc(id)})</small><br>“${esc(quote)}”</div>`).join('')}
    <p><b>Matching patterns</b> · ${esc(active.join(' / ')||'None')}</p>${modified?`<p>${esc(changes.join(' / ')||'The matching patterns are unchanged.')}</p>`:''}`;
    lab.querySelector('#sparql').textContent=queries[query.value];
    lab.querySelector('#rows').textContent=result[query.value].map(row=>row.join(' | ')).join('\n')||'0 matching rows';
    lab.querySelector('#restore').disabled=!modified;
  }
  for(const control of [citation,criterion,query]) control.onchange=update;
  lab.querySelector('#restore').onclick=()=>{[citation.value,criterion.value]=c.base;update();};
  update();
}
nav.onclick=e=>{if(e.target.dataset.case)location.hash=e.target.dataset.case;};
window.addEventListener('hashchange',openCase);
openCase();
</script></html>
